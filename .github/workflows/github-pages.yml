name: Deploy to GitHub Pages

# Free host: https://deedmicrofinance.github.io/deed-car-financing-campaign/
# Needs Settings > Pages > Source: "GitHub Actions". Deploys on every push to main.
# To stop it (e.g. after moving to Firebase Hosting), add the repository variable DISABLE_PAGES = true.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DISABLE_PAGES != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
