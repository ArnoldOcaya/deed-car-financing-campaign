<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR Code Maker | DEED Campaign</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding-bottom: 0; }
    .tool { padding: 24px 0 48px; }
    textarea, .url-in { width: 100%; font: inherit; font-size: 15px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; }
    textarea { min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
    .qr { background: #fff; border: 2px solid var(--brand); border-radius: 16px; padding: 16px; text-align: center; break-inside: avoid; }
    .qr h3 { font-size: 1rem; margin: 0 0 4px; color: var(--brand); text-transform: uppercase; }
    .qr .tag { font-size: .8rem; color: var(--muted); }
    .qr svg { width: 100%; height: auto; display: block; margin: 8px 0; }
    .qr .cta { font-weight: 800; font-size: .95rem; }
    .qr .u { font-size: .65rem; color: var(--muted); word-break: break-all; }
    .qr button { margin-top: 8px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    @media print {
      .no-print { display: none !important; }
      .grid { grid-template-columns: repeat(3, 1fr); }
      .qr button { display: none; }
    }
  </style>
</head>
<body>
  <main class="wrap tool">
    <div class="no-print">
      <h1 style="color:var(--brand)">Campaign QR codes</h1>
      <p class="muted">Each QR opens the same landing page with its own <code>?source=</code>, so every lead in the sheet shows where it came from. Staff tool, not linked from the main page.</p>

      <label class="field-label" for="base">Landing page address</label>
      <input id="base" class="url-in" inputmode="url">

      <label class="field-label" for="list" style="margin-top:14px">One QR per line: <code>source_id | Label</code> (source_id: lowercase letters, numbers, _ or -)</label>
      <textarea id="list">main_entrance | Main car bond entrance
showroom | Inside the showroom
vehicle_sticker | Vehicle windshield sticker
salesperson_01 | Salesperson desk 01
deed_banner | DEED promotional banner
facebook | Social media campaign</textarea>

      <div class="actions">
        <button class="btn btn-primary" id="gen">Make QR codes</button>
        <button class="btn btn-ghost" onclick="window.print()">Print</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="vendor/qrcode.js"></script>
  <script>
    (function () {
      var base = document.getElementById("base");
      base.value = location.origin + location.pathname.replace(/qr\.html$/, "");
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      function make() {
        var grid = document.getElementById("grid");
        grid.innerHTML = "";
        var b = base.value.trim();
        document.getElementById("list").value.split("\n").forEach(function (line) {
          if (!line.trim()) return;
          var parts = line.split("|");
          var id = parts[0].trim().toLowerCase().replace(/[^a-z0-9_\-]/g, "");
          var label = (parts[1] || id).trim();
          if (!id) return;
          var url = b + (b.indexOf("?") > -1 ? "&" : "?") + "source=" + encodeURIComponent(id);
          var qr = qrcode(0, "M");
          qr.addData(url); qr.make();
          var svg = qr.createSvgTag({ cellSize: 6, margin: 24, scalable: true });
          var card = document.createElement("div");
          card.className = "qr";
          card.innerHTML = "<h3>Drive your dream. Pay 30%.</h3><div class='tag'>" + esc(label) + "</div>" + svg +
            "<div class='cta'>Scan to check your financing</div><div class='u'>" + esc(url) + "</div>" +
            "<button class='btn btn-sm btn-ghost'>Download SVG</button>";
          card.querySelector("button").addEventListener("click", function () {
            var blob = new Blob([card.querySelector("svg").outerHTML], { type: "image/svg+xml" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = "qr-" + id + ".svg"; a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
          });
          grid.appendChild(card);
        });
      }
      document.getElementById("gen").addEventListener("click", make);
      make();
    })();
  </script>
</body>
</html>
